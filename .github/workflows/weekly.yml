name: weekly issue

on:
  schedule:
    - cron: "0 10 * * 0"   # Sunday 18:00 Singapore time
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python build.py
      - name: Commit the issue
        run: |
          git config user.name "causeway-weekly bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Issue $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Open the issue (this is the email to the owner)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(head -1 public/latest-title.txt)" --body-file public/latest.md
      - name: Send to subscribers
        if: ${{ env.RESEND_API_KEY != '' }}
        run: python send.py
